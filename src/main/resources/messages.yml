# Centralized user-facing text for orelia-debug's /oladmin debug tooling. Every chat
# message goes through rpg.core.message.MessageManager (reused from orelia-core) - do not
# hardcode ChatColor + literal strings in command code, add a key here instead.
config-version: 1

prefix: "&%8[&%6OreliaDebug&%8] &r"

command:
  player-only: "&%cプレイヤーのみ実行できます。"
  player-not-found: "&%c対象のプレイヤーが見つかりません: {player}"

usage:
  gui: "&%e使い方: /oladmin gui &%7<&%estatus&%7|&%eequipment&%7|&%eskill&%7|&%ejob&%7|&%eshop&%7|&%ewarehouse&%7|&%eauction&%7|&%email&%7|&%eranking&%7>&%e &%7[&%eplayer&%7]&%e"
  money: "&%e使い方: /oladmin money &%7<&%egive&%7|&%eset&%7|&%etake&%7>&%e &%7[&%eplayer&%7]&%e &%7<&%eamount&%7>&%e"
  config: "&%e使い方: /oladmin config &%7<&%ecore&%7|&%eworld&%7|&%eextra&%7>&%e &%7<&%elist&%7|&%eget &%7<&%efile&%7>&%e &%7<&%epath&%7>&%e&%7|&%eset &%7<&%efile&%7>&%e &%7<&%epath&%7>&%e &%7<&%evalue&%7>&%e&%7|&%esave &%7<&%efile&%7>&%e&%7>&%e"
  confighelp: "&%e使い方: /oladmin confighelp &%7<&%ecore&%7|&%eworld&%7|&%eextra&%7>&%e &%7<&%efile&%7>&%e"
  quest: "&%e使い方: /oladmin quest &%7<&%ecomplete&%7|&%estart&%7|&%eresetcooldown&%7>&%e &%7[&%eplayer&%7]&%e &%7<&%equestId&%7>&%e&%7|&%elist &%7[&%eplayer&%7]&%e&%7|&%eids&%e"
  title: "&%e使い方: /oladmin title &%7<&%elist&%7|&%eunequip&%7>&%e &%7[&%eplayer&%7]&%e&%7|&%e&%7<&%egrant&%7|&%eequip&%7>&%e &%7[&%eplayer&%7]&%e &%7<&%etitle&%7>&%e"
  dungeon: "&%e使い方: /oladmin dungeon &%7<&%eunlock&%7|&%eforcestart&%7>&%e &%7[&%eplayer&%7]&%e &%7<&%edungeonId&%7>&%e&%7|&%eforceend&%7|&%estatus&%7>&%e &%7[&%eplayer&%7]&%e&%7|&%eids&%e"
  exp: "&%e使い方: /oladmin exp give &%7[&%eplayer&%7]&%e &%7<&%eamount&%7>&%e"
  skillpoints: "&%e使い方: /oladmin skillpoints &%7<&%egive&%7|&%eset&%7|&%etake&%7>&%e &%7[&%eplayer&%7]&%e &%7<&%eamount&%7>&%e"

gui:
  opened: "&%a{player}に{screen}画面を表示しました。"
  unsupported: "&%c指定した画面は対応していません: {screen}"
  extra-not-installed: "&%cOreliaExtraが導入されていないため使用できません。"
  world-not-installed: "&%cOreliaWorldが導入されていないため使用できません。"

money:
  invalid-amount: "&%c金額は数値で指定してください。"
  given: "&%a{player}に{amount}を付与しました。（残高: {balance}）"
  set: "&%a{player}の所持金を{amount}に設定しました。"
  taken: "&%a{player}から{amount}を引き出しました。（残高: {balance}）"
  take-failed: "&%c残高が不足しているため引き出せませんでした。"

skillpoints:
  invalid-amount: "&%c数量は整数で指定してください。"
  given: "&%a{player}にスキル習得ポイントを{amount}付与しました。（残高: {balance}）"
  set: "&%a{player}のスキル習得ポイントを{amount}に設定しました。"
  taken: "&%a{player}からスキル習得ポイントを{amount}引き出しました。（残高: {balance}）"
  take-failed: "&%c残高が不足しているため引き出せませんでした。"

config:
  unknown-target: "&%c不明な対象です: {target}（core|world|extra のいずれか）"
  file-list-header: "&%a[{target}] 設定ファイル一覧:"
  file-list-entry: "&%7- {file}"
  value: "&%a{file}:{path} = {value}"
  value-not-found: "&%c値が見つかりません: {file}:{path}"
  set-success: "&%a{file}:{path} を {value} に設定しました。"
  set-failed: "&%c設定に失敗しました（ファイルが登録されていません）: {file}"
  saved: "&%a{file} を保存しました。"
  keys-header: "&%a[{target}] {file} のキー一覧:"
  keys-empty: "&%eキーが見つかりません（ファイルが登録されていないか、空です）。"

quest:
  force-completed: "&%a{player}のクエスト「{quest}」の目標を強制達成しました。対象プレイヤーに /ol quest でGUIから報告してもらってください。"
  force-complete-failed: "&%c強制達成できませんでした（未受注か、既に受注中でない可能性があります）。"
  force-started: "&%a{player}にクエスト「{quest}」を強制受注させました（前提条件・レベル制限は無視されます）。"
  force-start-failed: "&%c強制受注できませんでした（存在しないクエストか、既に受注中の可能性があります）。"
  cooldown-reset: "&%a{player}のクエスト「{quest}」の完了記録をクリアしました。即座に再受注できます。"
  cooldown-reset-failed: "&%c完了記録をクリアできませんでした（一度も完了していない可能性があります）。"
  list-header: "&%a{player}の受注中クエスト:"
  list-entry: "&%7- {quest}"
  list-empty: "&%e{player}は現在クエストを受注していません。"
  ids-header: "&%aquests.ymlに定義されている全クエストID:"
  ids-entry: "&%7- {quest}"

title:
  list-header: "&%a{player}の取得済み称号:"
  list-entry: "&%7- {title}"
  list-entry-equipped: "&%a- {title} &%7(装備中)"
  list-empty: "&%e{player}はまだ称号を取得していません。"
  granted: "&%a{player}に称号「{title}」を付与しました。"
  grant-failed: "&%c称号を付与できませんでした（対象プレイヤーのデータが見つかりません）。"
  equipped: "&%a{player}に称号「{title}」を強制装備させました（未取得でも装備されます）。"
  equip-failed: "&%c称号を装備できませんでした（対象プレイヤーのデータが見つかりません）。"
  unequipped: "&%a{player}の称号を解除しました。"
  unequip-failed: "&%c称号を解除できませんでした（対象プレイヤーのデータが見つかりません）。"

dungeon:
  unlocked: "&%a{player}にダンジョン「{dungeon}」を開放しました。"
  unlock-failed: "&%c開放できませんでした（対象プレイヤーのデータが見つからないか、不明なダンジョンです）。"
  force-started: "&%a{player}にダンジョン「{dungeon}」を強制開始させました。"
  force-start-failed: "&%c強制開始できませんでした（{reason}）。"
  force-ended: "&%a{player}のダンジョンを強制終了しました。"
  force-end-failed: "&%c強制終了できませんでした（ダンジョンに挑戦していない可能性があります）。"
  status-active: "&%a{player}は現在ダンジョン「{dungeon}」に挑戦中です。"
  status-idle: "&%e{player}は現在ダンジョンに挑戦していません。"
  ids-header: "&%adungeons.ymlに定義されている全ダンジョンID:"
  ids-entry: "&%7- {dungeon}"

exp:
  invalid-amount: "&%c経験値は数値で指定してください。"
  given: "&%a{player}に経験値{amount}を付与しました。"
